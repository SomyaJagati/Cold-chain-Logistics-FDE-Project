[project]
name = "cold-chain-logistics"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "SomyaJagati", email = "somyajagati@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "altair>=6.3.0",
    "faiss-cpu>=1.15.1",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.4.2",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.3",
    "langchain-pinecone>=0.2.13",
    "langgraph>=1.2.18",
    "langgraph-checkpoint>=4.3.1",
    "langsmith>=0.14.12",
    "openai>=3.39.0",
    "openpyxl>=3.1.5",
    "pandas>=3.1.0",
    "pinecone>=7.3.0",
    "pydantic-settings>=2.16.1",
    "pyodbc>=5.3.0",
    "pypdf>=6.21.2",
    "python-dotenv>=1.2.4",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=6.2.0",
    "sqlalchemy>=2.1.6",
    "streamlit>=1.66.1",
    "torch>=2.14.1",
]

[project.scripts]
cold-chain-logistics = "cold_chain_logistics:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
